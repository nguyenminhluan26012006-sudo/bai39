<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang Chủ - Bài Tập & Đèn Kéo Quân</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: linear-gradient(135deg, #1f1c2c, #928dab);
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 20px;
        }

        header h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        header p {
            font-size: 1.1rem;
            color: #ddd;
        }

        .main-container {
            display: flex;
            flex-wrap: wrap;
            gap: 40px;
            align-items: flex-start;
            justify-content: center;
            width: 100%;
            max-width: 1200px;
            flex: 1;
        }

        /* Khối Menu / Links */
        .menu-section {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            border: 1px solid rgba(255, 255, 255, 0.18);
            min-width: 320px;
        }

        .menu-section h2 {
            margin-bottom: 20px;
            font-size: 1.5rem;
            border-bottom: 2px solid rgba(255,255,255,0.2);
            padding-bottom: 10px;
        }

        .menu-list {
            list-style: none;
        }

        .menu-list li {
            margin-bottom: 15px;
        }

        .menu-list button {
            display: block;
            width: 100%;
            text-align: left;
            text-decoration: none;
            color: #fff;
            background: #ff5e62;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0,0,0,0.2);
        }

        .menu-list button:hover {
            background: #ff9966;
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.3);
        }

        .menu-list button.active {
            background: #00b894;
            box-shadow: 0 0 0 3px rgba(0, 184, 148, 0.4);
        }

        /* Khung hiển thị hình kết quả bài 38 */
        .result-box {
            margin-top: 15px;
            display: none;
            text-align: center;
            background: rgba(0, 0, 0, 0.4);
            padding: 10px;
            border-radius: 8px;
            border: 1px dashed #ffd700;
        }

        .result-box img {
            max-width: 100%;
            height: auto;
            border-radius: 6px;
            max-height: 250px;
        }

        /* Khối Đèn Kéo Quân 3D */
        .lantern-section {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            perspective: 1000px;
            height: 400px;
            flex: 1;
            min-width: 320px;
        }

        .lantern-section.show {
            display: flex;
        }

        .scene {
            width: 200px;
            height: 250px;
            position: relative;
            transform-style: preserve-3d;
            animation: rotateLantern 12s linear infinite;
            /* Cho phép dừng animation mượt mà */
            animation-play-state: running;
        }

        /* Khi rê chuột vào scene -> dừng quay */
        .scene.paused {
            animation-play-state: paused;
        }

        .carousel {
            width: 100%;
            height: 100%;
            position: absolute;
            transform-style: preserve-3d;
        }

        .carousel__face {
            position: absolute;
            width: 180px;
            height: 230px;
            left: 10px;
            top: 10px;
            border: 2px solid #ffd700;
            border-radius: 10px;
            overflow: hidden;
            background: rgba(0, 0, 0, 0.6);
            box-shadow: inset 0 0 15px rgba(255, 215, 0, 0.5);
            cursor: pointer;
        }

        .carousel__face img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            pointer-events: none; /* để sự kiện chuột bắt ở face, không bị img chặn */
        }

        .carousel__face:nth-child(1) { transform: rotateY(0deg) translateZ(173px); }
        .carousel__face:nth-child(2) { transform: rotateY(60deg) translateZ(173px); }
        .carousel__face:nth-child(3) { transform: rotateY(120deg) translateZ(173px); }
        .carousel__face:nth-child(4) { transform: rotateY(180deg) translateZ(173px); }
        .carousel__face:nth-child(5) { transform: rotateY(240deg) translateZ(173px); }
        .carousel__face:nth-child(6) { transform: rotateY(300deg) translateZ(173px); }

        @keyframes rotateLantern {
            from { transform: rotateY(0deg); }
            to { transform: rotateY(-360deg); }
        }

        .lantern-title {
            margin-top: 20px;
            font-size: 1.2rem;
            color: #ffd700;
            font-weight: bold;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.8);
        }

        .lantern-hint {
            margin-top: 8px;
            font-size: 0.85rem;
            color: #ddd;
            font-style: italic;
        }

        footer {
            margin-top: 30px;
            text-align: center;
            font-size: 0.9rem;
            color: #ccc;
        }
    </style>
</head>
<body>

    <header>
        <h1>Trang Chủ Bài Tập</h1>
        <p>Chào mừng bạn đến với không gian trưng bày sản phẩm thực hành</p>
    </header>

    <div class="main-container">
        <!-- Phần Menu Liên Kết -->
        <div class="menu-section">
            <h2>Danh Mục Bài Tập</h2>
            <ul class="menu-list">
                <li>
                    <button id="btnBai38" onclick="showBai38()">📁 Xem Kết Quả Bài Tập 38</button>
                    <div id="bai38-result" class="result-box">
                        <img src="images/bai_tap_38.jpg" alt="Kết quả Bài tập 38">
                        <p style="font-size: 0.85rem; margin-top: 5px; color: #ffd700;">Kết quả Bài tập 38</p>
                    </div>
                </li>
                <li>
                    <button id="btnBai39" onclick="showBai39()">🏮 Xem Đèn Kéo Quân (Bài 39)</button>
                </li>
            </ul>
        </div>

        <!-- Phần Hiệu ứng Đèn Kéo Quân 3D (Bài 39) -->
        <div id="lanternSection" class="lantern-section">
            <!-- Gắn sự kiện mouseenter / mouseleave lên .scene -->
            <div class="scene" id="lanternScene"
                 onmouseenter="pauseLantern()"
                 onmouseleave="resumeLantern()">
                <div class="carousel">
                    <div class="carousel__face"><img src="images/anh1.jpg" alt="Mặt 1"></div>
                    <div class="carousel__face"><img src="images/anh2.jpg" alt="Mặt 2"></div>
                    <div class="carousel__face"><img src="images/anh3.jpg" alt="Mặt 3"></div>
                    <div class="carousel__face"><img src="images/anh4.jpg" alt="Mặt 4"></div>
                    <div class="carousel__face"><img src="images/anh5.jpg" alt="Mặt 5"></div>
                    <div class="carousel__face"><img src="images/anh6.jpg" alt="Mặt 6"></div>
                </div>
            </div>
            <div class="lantern-title">Đèn Kéo Quân 6 Mặt Xoay Vòng Tròn</div>
            <div class="lantern-hint">💡 Rê chuột vào đèn để dừng lại, rê ra ngoài để quay tiếp</div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 - Thiết kế giao diện HTML/CSS/JS</p>
    </footer>

    <script>
        var btn38 = document.getElementById("btnBai38");
        var btn39 = document.getElementById("btnBai39");
        var result38 = document.getElementById("bai38-result");
        var lantern = document.getElementById("lanternSection");
        var scene = document.getElementById("lanternScene");

        function showBai38() {
            result38.style.display = "block";
            lantern.classList.remove("show");
            // Đảm bảo khi ẩn đèn thì trạng thái quay được reset
            scene.classList.remove("paused");
            btn38.classList.add("active");
            btn39.classList.remove("active");
        }

        function showBai39() {
            result38.style.display = "none";
            lantern.classList.add("show");
            btn39.classList.add("active");
            btn38.classList.remove("active");
        }

        /* Dừng đèn khi rê chuột vào */
        function pauseLantern() {
            scene.classList.add("paused");
        }

        /* Quay tiếp khi rê chuột ra */
        function resumeLantern() {
            scene.classList.remove("paused");
        }
    </script>

</body>
</html>
